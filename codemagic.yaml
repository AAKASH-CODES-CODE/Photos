workflows:
  my-flutter-workflow:
    name: Build Android APK
    working_directory: photovault_flutter
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      flutter: stable
    scripts:
      - name: Fix Android v1 Embedding (Auto-Upgrade)
        script: |
          rm -rf android
          flutter create --platforms=android .
      - name: Setup Gradle Memory & Compile 36
        script: |
          echo "org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8" > android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          cat << 'EOF' >> android/build.gradle
          
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF
      - name: Get Flutter Packages
        script: flutter pub get
      - name: Build Android APK (Catch Exact Error)
        script: flutter build apk --release --verbose
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
